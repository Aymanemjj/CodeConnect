<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header class="h-20 bg-black text text-white	">
        hello <br>

    </header>
    <section class="flex flex-col px-3 py-30 border-b justify-between">
        <div class="font-bold text-3xl">Browse Missions</div>
        <div class="text-gray-600">Find your next freelance opportunity</div>
    </section>

    <section class="flex flex-row justify-between py-5 px-5 border-b">
        <input class="py-4 px-28 rounded-xl bg-gray-300" placeholder="rechercher une mission" type="search">
        <select class=" py-4 rounded-xl px-30 bg-gray-300" name="" id="">
            <option value="">all categoris</option>
            <option value="">Web devlopement</option>
            <option value="">Graphic designe</option>
            <option value="">Contente writing</option>
            <option value="">Marketing</option>
            <option value="">Ui/Ux designe</option>
            <option value="">Mobile developement</option>

        </select>
        <select class="py-4 rounded-xl px-30 bg-gray-300" name="" id="">
            <option value=""> contrat à distance</option>
            <option value=""> contrat sur site</option>
        </select>

    </section>
    <section class="bg-gray-100 min-h-screen flex flex-col gap-10 items-center justify-center p-4">
        <div class="max-w-2xl w-full bg-white rounded-lg shadow-md overflow-hidden">
            <!-- Header Section -->
            <div class="p-6 border-b border-gray-200">
                <div class="flex justify-between items-start">
                    <div>
                        <h1 id="mession-title1" class="text-2xl font-bold text-gray-800">
                        </h1>
                        <div class="mt-2 flex items-center">
                            <span
                               id="mission-niveau1" class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full font-medium"></span>
                        </div>
                    </div>
                    <button class="text-gray-500 hover:text-gray-700">
                        <i class="far fa-bookmark text-xl"></i>
                    </button>
                </div>
                <div class="mt-4">
                    <p id="site-name1" class="text-gray-700 font-medium"></p>
                </div>
            </div>

            <!-- Description Section -->
            <div class="p-6 border-b border-gray-200">
                <p id="mission-description1" class="text-gray-600">
                   
                </p>
            </div>

            <!-- Skills Section -->
            <div class="p-6 border-b border-gray-200">
                <div class="flex flex-wrap gap-2">
                    <span id="mission1-tool1" class="bg-gray-100 text-gray-800 text-sm px-3 py-1.5 rounded-full"></span>
                    <span id="mission1-tool2" class="bg-gray-100 text-gray-800 text-sm px-3 py-1.5 rounded-full"></span>
                    <span id="mission1-tool3" class="bg-gray-100 text-gray-800 text-sm px-3 py-1.5 rounded-full"></span>
                    <span id="mission1-tool4" class="bg-gray-100 text-gray-800 text-sm px-3 py-1.5 rounded-full"></span>
                    <span id="mission1-tool5" class="bg-gray-100 text-gray-800 text-sm px-3 py-1.5 rounded-full"></span>
                </div>
            </div>

            <!-- Details Section -->
            <div class="p-6 border-b border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="flex items-center">
                        <i class="fas fa-dollar-sign text-gray-500 mr-2"></i>
                        <span id="mission-prix1" class="text-gray-700 font-medium"></span>
                    </div>
                    <div class="flex items-center">
                        <i class="far fa-calendar text-gray-500 mr-2"></i>
                        <span id="mission-dure1" class="text-gray-700 font-medium"></span>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-laptop-house text-gray-500 mr-2"></i>
                        <span id="mission-contrat1" class="text-gray-700 font-medium"></span>
                    </div>
                </div>
            </div>



            <!-- Action Buttons -->
            <div class="p-6 flex items-center">
                <button
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-70 rounded-lg transition duration-200">
                    Apply Now
                </button>

            </div>
        </div>
